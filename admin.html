<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="admin-wrapper">
    <aside class="sidebar">
      <div class="logo">Panel</div>
      <nav>
        <a href="#" class="active">Dashboard</a>
        <a href="#">Kullanıcılar</a>
        <a href="#">Ürünler</a>
        <a href="#">Ayarlar</a>
      </nav>
    </aside>
    <div class="main">
      <header class="topbar">
        <h1>Dashboard</h1>
        <span class="user">Merhaba, Admin</span>
      </header>
      <section class="content">
        <div class="card">
          <h2>Toplam Kullanıcı</h2>
          <p class="stat">128</p>
        </div>
        <div class="card">
          <h2>Bugünkü Ziyaret</h2>
          <p class="stat">1.240</p>
        </div>
        <div class="card">
          <h2>Bekleyen Sipariş</h2>
          <p class="stat">7</p>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
